<div tuiCardLarge>
  <header tuiHeader>
    <h3>{{ article.title }}</h3>
  </header>
  <div [innerHTML]="article.content"></div>
  <br>
  <label>
    Rating
    <tui-rating class="rating" [readonly]="true" [ngModel]="article.rate" icon="@tui.face-slightly-smiling" [max]="10"></tui-rating>
  </label>
  <footer>
    <a tuiButton appearance="secondary" [routerLink]="['/article', article.id]">Read more</a>
  </footer>
</div>
